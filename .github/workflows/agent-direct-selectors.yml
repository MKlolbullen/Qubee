name: Agent opaque direct selectors

on:
  push:
    branches:
      - agent/direct-retry-routing

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/direct-retry-routing
          fetch-depth: 0

      - name: Correct patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/agent_direct_selectors.py')
          text = p.read_text()

          start = text.index("replace_once(\n    path,\n    '''        let loaded = get_peer_bundle")
          end = text.index("\n\n# ---------------------------------------------------------------------------\n# Direct wire", start)
          call = '''replace_once(
              path,
              """        assert_eq!(got.identity_x25519, body.identity_x25519);\n        assert_eq!(got.kem_public, body.kem_public);\n""",
              """        assert_eq!(got.identity_x25519, body.identity_x25519);\n        assert_eq!(got.kem_public, body.kem_public);\n        let ids = list_peer_bundle_ids(&ks).unwrap();\n        assert!(ids.contains(&kp.identity_id()));\n""",
          )'''
          text = text[:start] + call + text[end:]

          stale = "replace_once(path, '        let _ = inspect_direct_sender(&mutated);\\n', '        let _ = inspect_direct_selectors(&mutated);\\n')\n"
          if stale not in text:
              raise SystemExit('stale mutated-parser anchor not found in patch script')
          text = text.replace(stale, '', 1)
          p.write_text(text)
          PY

      - name: Apply opaque selector patch
        run: python3 scripts/agent_direct_selectors.py

      - name: Translate direct adversarial tests to selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ratchet/direct.rs')
          text = p.read_text()

          replacements = {
              'assert_eq!(inspect_direct_sender(&w1).unwrap(), aid);':
                  'assert_eq!(inspect_direct_sender(&b.ks, &w1).unwrap(), aid);',
              '            dm.sender_id = aid;':
                  '            dm.sender_selector = direct_identity_selector(&aid, &dm.route_nonce);',
              '        dm.sender_id = bid;\n        let err = decrypt_direct(&mut b.ks, bid, &dm.to_wire().unwrap(), 1).unwrap_err();\n        assert!(err.to_string().contains("from ourselves"));':
                  '        dm.sender_selector = direct_identity_selector(&bid, &dm.route_nonce);\n        let err = decrypt_direct(&mut b.ks, bid, &dm.to_wire().unwrap(), 1).unwrap_err();\n        assert!(err.to_string().contains("verified peer"));',
              '        assert!(inspect_direct_sender(b"QUBEE_GMS\\x01whatever").is_none());\n        assert!(inspect_direct_sender(&[]).is_none());':
                  '        let device = Device::new();\n        assert!(inspect_direct_sender(&device.ks, b"QUBEE_GMS\\x01whatever").is_none());\n        assert!(inspect_direct_sender(&device.ks, &[]).is_none());',
              '        assert!(err.to_string().contains("no verified prekey bundle"));':
                  '        assert!(err.to_string().contains("verified peer"));',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'direct test rewrite expected one match, got {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Direct ratchet tests
        run: cargo test ratchet::direct -- --nocapture

      - name: Direct inbox network isolation test
        run: cargo test --test p2p_direct_inbox_e2e -- --nocapture

      - name: Wire/parser regression tests
        run: |
          cargo test --test wire_stability
          cargo test --test wire_parser_robustness

      - name: Full Rust suite
        run: cargo test --all-targets

      - name: Check fuzz target compiles
        run: cargo check --manifest-path fuzz/Cargo.toml --bin parse_direct_message

      - name: Remove one-shot machinery
        if: success()
        run: |
          rm -f scripts/agent_direct_selectors.py
          rm -f .github/workflows/agent-direct-selectors.yml

      - name: Commit validated patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(routing): hide direct endpoint identities behind selectors"
          git push origin HEAD:agent/direct-retry-routing
