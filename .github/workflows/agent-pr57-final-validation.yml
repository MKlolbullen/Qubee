name: Agent PR57 final validation

on:
  push:
    branches:
      - agent/direct-retry-routing

permissions:
  contents: write

jobs:
  jni-and-android:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/direct-retry-routing
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check JNI symbol contract
        run: bash scripts/check_jni_contracts.sh

      - name: Audit message/file bridge contract
        run: bash scripts/audit_message_file_bridge.sh

      - name: Typecheck JNI surface
        run: cargo build --features _typecheck_jni

      - name: Clippy changed Rust surface
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Compile Android debug Kotlin
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Remove one-shot workflow
        if: success()
        run: rm -f .github/workflows/agent-pr57-final-validation.yml

      - name: Commit cleanup
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove PR57 validation workflow"
          git push origin HEAD:agent/direct-retry-routing
