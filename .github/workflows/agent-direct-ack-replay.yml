name: agent-direct-ack-replay

on:
  push:
    branches:
      - agent/direct-ratchet-acks
    paths:
      - .github/workflows/agent-direct-ack-replay.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-ratchet-acks
          fetch-depth: 0

      - name: Apply guarded replay-hardening patch
        run: python3 tools/patch_direct_ack_replay.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android compile SDK
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt

      - name: Rust formatting remains clean
        run: cargo fmt --all -- --check

      - name: Rust full suite remains green
        run: cargo test --all-targets

      - name: Clippy warnings are errors
        run: cargo clippy --all-targets -- -D warnings

      - name: JNI symbol contract
        run: bash scripts/check_jni_contracts.sh

      - name: Android Kotlin compile
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Android instrumented-test sources compile
        run: ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Commit validated replay hardening and self-clean
        run: |
          rm -f tools/patch_direct_ack_replay.py .github/workflows/agent-direct-ack-replay.yml
          git add -A
          git status --short
          git config user.name 'openai-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ratchet): replay cached direct receipt wire'
          git push origin HEAD:agent/direct-ratchet-acks
