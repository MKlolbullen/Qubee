# Project-wide Gradle settings.

# JVM args for the Gradle daemon. Compose + Hilt + Paparazzi together
# need a fair bit of heap; 4 GB is the standard recommendation.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Use AndroidX support libraries
android.useAndroidX=true

# Configuration cache and parallel execution speed up local builds.
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style for IDE
kotlin.code.style=official

# Disable kapt's incremental annotation processing. Room 2.6.0's
# XProcessing-based RoomProcessor.getSupportedOptions() reads a
# processing env that is only populated in init(), but kapt's
# incremental wrapper (IncrementalProcessor -> IncrementalAptCache)
# calls getSupportedOptions() before init(), throwing
# "processingEnv must not be null" and failing kaptDebugKotlin. Turning
# incremental APT off routes getSupportedOptions() through the normal
# post-init path. Cost is a non-incremental annotation-processing pass;
# output is identical, so reproducibility is unaffected.
kapt.incremental.apt=false
