name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Jobs in this workflow compile/test untrusted PR code
# and do not need repository write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 2
  RUST_BACKTRACE: 1

jobs:
  rust-test:
    name: cargo test (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-default

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # This is intentionally blocking. `-D warnings` is meaningless as a
      # security/quality gate when the workflow is allowed to ignore failure.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-targets

      # Type-check the Android JNI module on the host without requiring an NDK.
      - name: typecheck JNI surface
        run: cargo build --locked --features _typecheck_jni

      # Compile benches without executing the full Criterion suite.
      - name: cargo bench --no-run
        run: cargo bench --locked --no-run

  rust-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-audit

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2

      # Keep warning output visible without allowing warning-only findings to
      # block the build. The next step is the actual vulnerability gate.
      - name: Audit Cargo.lock (informational warnings)
        run: cargo audit --deny warnings || true

      - name: Audit vulnerabilities / unsound / yanked (must pass)
        run: cargo audit --deny unsound --deny yanked

  osv-scan:
    name: OSV scan (GHSA coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # cargo-audit sees RustSec. This additionally sweeps the dependency
      # surfaces documented in scripts/osv_scan.sh against OSV.dev.
      - name: Sweep dependency surfaces against OSV.dev
        run: bash scripts/osv_scan.sh
