name: Record Paparazzi baselines

# Re-records app/src/test/snapshots/ on a runner and uploads the PNGs
# as an artifact. Recording needs the Android SDK, which not every
# contributor environment can fetch; android-smoke.yml remains the gate.
#
# Two ways in: "Run workflow" on any branch, or push a branch named
# paparazzi/record/<anything>. The push trigger exists because GitHub
# only offers manual dispatch for workflows already on the default branch.

on:
  workflow_dispatch:
  push:
    branches:
      - 'paparazzi/record/**'

permissions:
  contents: read

concurrency:
  group: paparazzi-record-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: ./gradlew :app:recordPaparazziDebug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-paparazzi-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}

      - name: Record baselines
        run: |
          chmod +x ./gradlew
          ./gradlew :app:recordPaparazziDebug --no-daemon --stacktrace

      - name: Verify the fresh baselines round-trip
        run: ./gradlew :app:verifyPaparazziDebug --no-daemon --stacktrace

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-baselines-${{ github.sha }}
          path: app/src/test/snapshots/
          retention-days: 7
