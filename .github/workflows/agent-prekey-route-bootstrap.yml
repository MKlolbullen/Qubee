name: Agent signed prekey route bootstrap

on:
  push:
    branches:
      - agent/direct-retry-routing

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/direct-retry-routing
          fetch-depth: 0

      - name: Apply signed-route bootstrap patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          path = "src/groups/group_handshake.rs"
          replace_once(
              path,
              'const PREKEY_BUNDLE_TAG: &[u8] = b"qubee_handshake_prekey_bundle_v1";',
              '''// _v2: bind the publisher current libp2p PeerId into the hybrid-signed bundle so
          // anonymous-gossip recipients can resolve IdentityId -> PeerId without trusting
          // a gossip propagation source.
          const PREKEY_BUNDLE_TAG: &[u8] = b"qubee_handshake_prekey_bundle_v2";''',
          )
          replace_once(
              path,
              '''pub struct PrekeyBundleBody {
              pub publisher: IdentityKey,
          ''',
              '''pub struct PrekeyBundleBody {
              pub publisher: IdentityKey,
              /// Current libp2p PeerId, hybrid-signed by `publisher`. This is a
              /// routing assertion, not a message-authentication key. Receivers
              /// only install it after the bundle's hybrid signature verifies.
              pub publisher_peer_id: String,
          ''',
          )
          replace_once(
              path,
              '''    out.extend_from_slice(body.publisher.identity_id.as_ref());
              out.push(0u8);
              out.extend_from_slice(&body.identity_x25519);''',
              '''    out.extend_from_slice(body.publisher.identity_id.as_ref());
              out.push(0u8);
              out.extend_from_slice(&(body.publisher_peer_id.len() as u32).to_le_bytes());
              out.extend_from_slice(body.publisher_peer_id.as_bytes());
              out.push(0u8);
              out.extend_from_slice(&body.identity_x25519);''',
          )

          path = "src/ratchet/prekey_store.rs"
          replace_once(
              path,
              '''pub fn build_body(
              secret: &PrekeyBundleSecret,
              kem_public: &KemPublicKey,
              publisher: IdentityKey,
              timestamp: u64,
          ) -> PrekeyBundleBody {
              PrekeyBundleBody {
                  publisher,
          ''',
              '''pub fn build_body(
              secret: &PrekeyBundleSecret,
              kem_public: &KemPublicKey,
              publisher: IdentityKey,
              timestamp: u64,
          ) -> PrekeyBundleBody {
              build_body_with_peer_id(secret, kem_public, publisher, String::new(), timestamp)
          }

          /// Route-aware form used by the live publisher after the libp2p node has
          /// established its local PeerId. The route is part of the signed body.
          pub fn build_body_with_peer_id(
              secret: &PrekeyBundleSecret,
              kem_public: &KemPublicKey,
              publisher: IdentityKey,
              publisher_peer_id: String,
              timestamp: u64,
          ) -> PrekeyBundleBody {
              PrekeyBundleBody {
                  publisher,
                  publisher_peer_id,
          ''',
          )
          replace_once(
              path,
              '''    #[test]
              fn peer_bundle_cache_round_trips() {''',
              '''    #[test]
              fn signed_bundle_binds_publisher_peer_id() {
                  let (mut ks, _d) = fresh_ks();
                  let kp = IdentityKeyPair::generate().unwrap();
                  let (secret, kem_pub) = get_or_create_local_bundle(&mut ks, 9).unwrap();
                  let body = build_body_with_peer_id(
                      &secret,
                      &kem_pub,
                      kp.public_key(),
                      "route-under-test".to_string(),
                      9,
                  );
                  let signed = sign_prekey_bundle(&kp, body).unwrap();
                  let (mut body, sig) = match signed {
                      GroupHandshake::PrekeyBundle { body, signature } => (body, signature),
                      _ => unreachable!(),
                  };
                  assert!(verify_prekey_bundle(&body, &sig).unwrap());
                  body.publisher_peer_id.push('X');
                  assert!(!verify_prekey_bundle(&body, &sig).unwrap());
              }

              #[test]
              fn peer_bundle_cache_round_trips() {''',
          )

          path = "src/jni_api.rs"
          replace_once(
              path,
              'use crate::ratchet::prekey_store::{build_body, get_or_create_local_bundle, store_peer_bundle};',
              '''use crate::ratchet::prekey_store::{
              build_body_with_peer_id, get_or_create_local_bundle, store_peer_bundle,
          };''',
          )
          replace_once(
              path,
              '            let body = build_body(&secret, &kem_public, identity.public_key(), now);',
              '''            let publisher_peer_id = LOCAL_PEER_ID.lock().unwrap().clone().unwrap_or_default();
              let body = build_body_with_peer_id(
                  &secret,
                  &kem_public,
                  identity.public_key(),
                  publisher_peer_id,
                  now,
              );''',
          )
          replace_once(
              path,
              '''fn resolve_peer_id(identity_hex: &str) -> Option<String> {
              PEER_DIRECTORY.lock().unwrap().get(identity_hex).cloned()
          }
          ''',
              '''fn resolve_peer_id(identity_hex: &str) -> Option<String> {
              PEER_DIRECTORY.lock().unwrap().get(identity_hex).cloned()
          }

          /// Install a route assertion from a prekey bundle only after the bundle's
          /// hybrid identity signature has verified. Anonymous gossipsub has no
          /// trustworthy author PeerId, so this signed field bootstraps first-contact
          /// IdentityId -> PeerId routing without trusting a relay hop.
          fn install_prekey_peer_route(
              body: &crate::groups::group_handshake::PrekeyBundleBody,
          ) -> anyhow::Result<()> {
              if body.publisher_peer_id.is_empty() {
                  return Ok(());
              }
              let peer: libp2p::PeerId = body
                  .publisher_peer_id
                  .parse()
                  .map_err(|e| anyhow::anyhow!("invalid signed prekey PeerId: {e}"))?;
              let peer_id = peer.to_string();
              let identity_hex = hex::encode(body.publisher.identity_id.as_ref() as &[u8]);
              PEER_DIRECTORY
                  .lock()
                  .unwrap()
                  .insert(identity_hex.clone(), peer_id.clone());
              dispatch_peer_linked(peer_id, identity_hex);
              Ok(())
          }
          ''',
          )
          replace_once(
              path,
              '            store_peer_bundle(ks, &body)?;\n',
              '            store_peer_bundle(ks, &body)?;\n            install_prekey_peer_route(&body)?;\n',
          )

          path = "tests/wire_stability.rs"
          replace_once(
              path,
              '''        publisher: kp.public_key(),
              identity_x25519: [1u8; 32],''',
              '''        publisher: kp.public_key(),
              publisher_peer_id: "route-under-test".to_string(),
              identity_x25519: [1u8; 32],''',
          )
          replace_once(
              path,
              'assert!(canonical.starts_with(b"qubee_handshake_prekey_bundle_v1"));',
              'assert!(canonical.starts_with(b"qubee_handshake_prekey_bundle_v2"));',
          )
          replace_once(
              path,
              'GroupHandshake::PrekeyBundle { .. } => "qubee_handshake_prekey_bundle_v1",',
              'GroupHandshake::PrekeyBundle { .. } => "qubee_handshake_prekey_bundle_v2",',
          )

          print("signed prekey route bootstrap patch applied")
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Test Rust
        run: cargo test --all-targets

      - name: Remove one-shot workflow
        if: success()
        run: rm -f .github/workflows/agent-prekey-route-bootstrap.yml

      - name: Commit validated patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(routing): bootstrap PeerIds from signed prekeys"
          git push origin HEAD:agent/direct-retry-routing
