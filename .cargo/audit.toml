# cargo-audit configuration.
#
# Each ignore entry must include a comment explaining the trade-off
# and a tracking pointer (upstream issue, planned upgrade window,
# etc.). Ignored advisories are reviewed quarterly.
#
# cargo-audit only sees the RustSec database. GHSA-only advisories
# (no RUSTSEC id) never fire here — scripts/osv_scan.sh sweeps the
# same lockfile (plus Gradle + workflow actions) against OSV.dev and
# is the authority for those; its allowlist mirrors this file.

[advisories]
ignore = [
    # hickory-proto 0.25.2 — pinned through libp2p 0.56's libp2p-dns
    # + libp2p-mdns. There is no fixed release on the 0.25 line at
    # all (RustSec marks 0.26.0-beta.1+ unaffected for 0118 and
    # 0.26.1+ patched for 0119), so this waits on libp2p adopting
    # hickory 0.26, not on a patch we can pick up ourselves. Both
    # advisories are network-side DoS-style issues, mitigated in
    # practice because:
    #
    # - mDNS is opt-in via `enable_mdns: bool` in `P2PNodeConfig`
    #   (default off in tests, only on for local discovery).
    # - DNS resolution happens once per dialed multiaddr, not on
    #   every packet, so an attacker can't trivially feed us
    #   compressed names at sustained rate.
    # - DNSSEC validation (the NSEC3 code path) is never enabled by
    #   libp2p-dns's resolver configuration.
    #
    # If libp2p hasn't adopted hickory 0.26 by 2026-12, switch to a
    # no-mdns/no-dns profile and re-evaluate.
    "RUSTSEC-2026-0118",  # NSEC3 closest-encloser unbounded loop
    "RUSTSEC-2026-0119",  # O(n²) name-compression CPU exhaustion
]
