name: Agent transient direct inbox

on:
  push:
    branches:
      - agent/direct-retry-routing

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/direct-retry-routing
          fetch-depth: 0

      - name: Apply transient inbox patch
        run: python3 scripts/agent_transient_direct_inbox.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Run direct-inbox network isolation test
        run: cargo test --test p2p_direct_inbox_e2e -- --nocapture

      - name: Run full Rust suite
        run: cargo test --all-targets

      - name: Remove one-shot machinery
        if: success()
        run: |
          rm -f scripts/agent_transient_direct_inbox.py
          rm -f .github/workflows/agent-transient-direct-inbox.yml

      - name: Commit validated patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(routing): make direct-inbox publishing transient"
          git push origin HEAD:agent/direct-retry-routing
