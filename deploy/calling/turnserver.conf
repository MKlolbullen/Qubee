# Public Linux VPS with host networking. A NATed VPS also needs
# TURN_EXTERNAL_IP in .env. Relay ports must be open in the host firewall.
listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49259
fingerprint
use-auth-secret
no-cli
no-multicast-peers
no-loopback-peers
# This still permits UDP relay allocations reached over TURN/TLS/TCP.
no-tcp-relay
cert=/run/secrets/tls_cert
pkey=/run/secrets/tls_key
# Keep session/IP diagnostics out of persistent Docker logs. The tmpfs log
# is discarded at container stop. Monitor its size under sustained load.
no-stdout-log
log-file=/run/qubee-turn/turn.log
pidfile=/run/qubee-turn/turn.pid
