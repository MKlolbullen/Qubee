name: Agent direct inbox network test

on:
  push:
    branches:
      - agent/direct-retry-routing

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/direct-retry-routing
          fetch-depth: 0

      - name: Format
        run: cargo fmt --all -- --check

      - name: Run direct-inbox network isolation test
        run: cargo test --test p2p_direct_inbox_e2e -- --nocapture

      - name: Run full Rust suite
        run: cargo test --all-targets

      - name: Remove one-shot workflow
        if: success()
        run: rm -f .github/workflows/agent-direct-inbox-test.yml

      - name: Commit cleanup
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove direct-inbox validation workflow"
          git push origin HEAD:agent/direct-retry-routing
