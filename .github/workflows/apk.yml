name: Build APK (on demand)

# On-demand installable APKs from any branch — press "Run workflow" in
# the Actions tab, pick the ref, download the artifact. Built for the
# Category-B physical-device runbook
# (docs/manual-testing/ratchet-cutover-device-matrix.md), which needs
# BOTH a debug build and an R8-minified release build installed on real
# hardware. The release APK is debug-signed when the release keystore
# secrets are absent (see the fallback in app/build.gradle) so
# `adb install` accepts it on a physical device; distributable signed
# releases still come exclusively from release.yml, which refuses to
# build without the real keystore.
#
# android-smoke.yml already builds + uploads APKs on every PR — this
# workflow exists for refs without an open PR and for rebuilding on
# demand, with longer artifact retention for a multi-day device run.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: Build installable debug + release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for versionCode + git describe

      - name: Resolve version
        id: ver
        run: |
          # Same versionCode scheme as release.yml (commit count =
          # monotonic per branch) so a device-matrix install upgrades
          # cleanly to the eventual tagged release. versionName marks
          # the build as a dev build off a specific commit.
          name="$(git describe --tags --always)-dev-calling"
          code=$(git rev-list --count HEAD)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName=$name versionCode=$code"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Add Android targets to the pinned toolchain
        # rust-toolchain.toml pins the compiler; rustup resolves it the
        # first time cargo/rustup runs in the repo, and the targets the
        # dtolnay step installed above only landed on the runner's
        # stable. Adding them here (cwd = repo root) attaches them to
        # the PINNED toolchain, which is the one build_rust.sh uses.
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-android-smoke  # share the smoke workflow's cache

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          # local-cache restores the NDK from the Actions cache, but the
          # restore drops the clang symlinks, so every cache-HIT run dies
          # in cc-rs with "failed to find tool .../bin/clang". A fresh
          # download (~1 min) every run is the reliable trade.
          local-cache: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^3

      - name: Build Rust shared libraries (4 ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # Compile the calling feature into the .so so the WebRTC/JNI
          # call symbols are present and the audio pipeline is exercisable
          # on-device. Default-feature builds ship elsewhere (release.yml,
          # android-smoke.yml); this on-demand build opts in.
          QUBEE_CARGO_FEATURES: calling
        run: |
          chmod +x ./build_rust.sh
          ./build_rust.sh
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            so="app/src/main/jniLibs/$abi/libqubee_crypto.so"
            if [ ! -f "$so" ]; then
              echo "::error::Missing $so after build_rust.sh"
              exit 1
            fi
          done

      - name: Assemble debug + release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease \
            -PqubeeVersionName='${{ steps.ver.outputs.name }}' \
            -PqubeeVersionCode='${{ steps.ver.outputs.code }}' \
            --no-daemon --stacktrace

      - name: Collect + verify installability
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk \
            "out/qubee-${{ steps.ver.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/release/*.apk \
            "out/qubee-${{ steps.ver.outputs.name }}-release-debugsigned.apk"
          # Both APKs must carry a valid signature or adb install will
          # reject them on hardware — fail here, not on the phone.
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in out/*.apk; do
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk" || {
              echo "::error::apksigner verify failed for $apk"
              exit 1
            }
          done
          (cd out && sha256sum *.apk | tee SHA256SUMS)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: qubee-apks-${{ steps.ver.outputs.name }}
          path: out/
          # Long enough to cover a multi-day, multi-device matrix run
          # without rebuilding.
          retention-days: 30
          if-no-files-found: error
