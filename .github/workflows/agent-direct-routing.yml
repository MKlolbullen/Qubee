name: Agent direct routing patch

on:
  push:
    branches:
      - agent/direct-retry-routing

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/direct-retry-routing
          fetch-depth: 0

      - name: Apply routing patch
        run: python3 scripts/agent_direct_routing.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Test Rust
        run: cargo test --all-targets

      - name: Remove one-shot patch machinery
        if: success()
        run: |
          rm -f tmp_ignore
          rm -f scripts/agent_direct_routing.py
          rm -f .github/workflows/agent-direct-routing.yml

      - name: Commit validated patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(routing): route ratchet DMs over direct libp2p"
          git push origin HEAD:agent/direct-retry-routing
