name: MobSF

on:
  push:
    branches: [main, original_1]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * 0'

permissions:
  contents: read

jobs:
  mobile-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned scanner
        run: python -m pip install 'mobsfscan==1.0.1'

      - name: Scan Android source
        run: python scripts/run_mobsfscan.py

      # Preserve findings even when the scan exits nonzero. A failed
      # installation does not masquerade as a completed clean scan.
      - name: Upload scan report
        if: ${{ always() && hashFiles('results.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobsfscan-${{ github.sha }}
          path: results.sarif
          retention-days: 30
          if-no-files-found: error

      - name: Publish findings to code scanning
        if: ${{ always() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: mobsfscan
