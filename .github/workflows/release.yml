name: Release APK

on:
  push:
    tags:
      - 'v*'
      # Bare semver tags build too. 0.1.0-alpha was cut without the
      # prefix and never triggered a release, leaving an asset-less
      # GitHub release behind.
      - '[0-9]*.[0-9]*.[0-9]*'
  # Allow manual dispatch from the Actions tab so a maintainer can
  # rebuild a release without re-tagging (e.g. to swap in a new
  # signing key).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0-beta.1)'
        required: true
        type: string
      dry_run:
        description: 'Only verify the signing secrets and certificate pin; build nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # needed to upload release assets

concurrency:
  # One release build at a time per ref. Cancel in-flight runs when
  # a new push lands on the same tag (rare, but happens during a
  # signing-key debug cycle).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails in seconds, not after a 15-minute native build, when the
  # signing configuration is incomplete. Values are never printed.
  preflight:
    name: Verify signing configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_CERTIFICATE_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
    steps:
      - name: Check the four RELEASE_* secrets and the certificate pin
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("secret $name")
          done
          if ! [[ "${RELEASE_CERTIFICATE_SHA256//:/}" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            missing+=("repository variable RELEASE_CERTIFICATE_SHA256 (64 hex digits)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release signing is not configured. Missing: $(printf '%s; ' "${missing[@]}")see RELEASE.md, One-time setup."
            exit 1
          fi
          echo "All four RELEASE_* secrets and the certificate pin are present."

  build:
    name: Build + sign + release
    needs: preflight
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # The tag globs above are loose (`[0-9]*` matches `1foo`);
          # this is the real gate. Semver with an optional v prefix and
          # an optional pre-release suffix, nothing else.
          if ! [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a semver release tag (expected v1.2.3 or 1.2.3, optional -prerelease suffix)."
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building release for tag=$tag (versionName=$version)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # full history for `git rev-list --count`
          ref: ${{ steps.tag.outputs.tag }}

      - name: Compute monotonic versionCode
        id: vcode
        run: |
          # Per-tag versionCode = number of commits leading to this
          # tag. Monotonic per branch; survives squash-merges; lets
          # Android's package manager accept every release as an
          # upgrade over its predecessor.
          code=$(git rev-list --count HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Add Android targets to the pinned toolchain
        # rust-toolchain.toml pins the compiler; rustup resolves it the
        # first time cargo/rustup runs in the repo, and the targets the
        # dtolnay step installed above only landed on the runner's
        # stable. Adding them here (cwd = repo root) attaches them to
        # the PINNED toolchain, which is the one build_rust.sh uses.
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-android-release

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          # local-cache restores the NDK from the Actions cache, but the
          # restore drops the clang symlinks, so every cache-HIT run dies
          # in cc-rs with "failed to find tool .../bin/clang". A fresh
          # download (~1 min) every run is the reliable trade.
          local-cache: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^3

      - name: Build Rust shared libraries (4 ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x ./build_rust.sh
          ./build_rust.sh
          # Sanity: every ABI directory must contain libqubee_crypto.so
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            so="app/src/main/jniLibs/$abi/libqubee_crypto.so"
            if [ ! -f "$so" ]; then
              echo "::error::Missing $so after build_rust.sh"
              exit 1
            fi
            echo "$so $(stat -c%s $so) bytes"
          done

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set; cannot sign release. Configure it in repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qubee-release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/qubee-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PqubeeRequireReleaseSigning=true \
            -PqubeeVersionName='${{ steps.tag.outputs.version }}' \
            -PqubeeVersionCode='${{ steps.vcode.outputs.code }}' \
            --no-daemon --stacktrace

      - name: Locate APK + verify signature
        id: apk
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
        run: |
          set -o pipefail
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$src" ]; then
            echo "::error::No APK in app/build/outputs/apk/release"
            exit 1
          fi
          dst="qubee-${{ steps.tag.outputs.version }}.apk"
          python3 scripts/sign_product_apk.py "$src" "$dst" \
            --certificate-sha256 "$EXPECTED_RELEASE_CERT_SHA256" | tee sign-report.txt
          # The verified signer fingerprint goes into the release notes
          # so a tester can compare it without trusting the APK itself.
          echo "cert=$(sed -n 's/^Verified owner certificate SHA-256: //p' sign-report.txt)" >> "$GITHUB_OUTPUT"
          echo "path=$dst" >> "$GITHUB_OUTPUT"
          echo "Built APK: $dst ($(stat -c%s $dst) bytes)"
          # Verify signature scheme
          # sign_product_apk requires both v2/v3 and the pinned owner
          # certificate; a valid signature from any other key is rejected.

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/qubee-release.jks"

      - name: Compute SHA256 + collect mapping
        id: shasum
        run: |
          sha256sum "${{ steps.apk.outputs.path }}" \
            | tee "${{ steps.apk.outputs.path }}.sha256"
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$mapping" ]; then
            cp "$mapping" "qubee-${{ steps.tag.outputs.version }}-mapping.txt"
            echo "mapping=qubee-${{ steps.tag.outputs.version }}-mapping.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        id: notes
        run: |
          # Pull the section for this version from CHANGELOG.md.
          # Falls back to the tag name if we can't find a matching
          # section (defensive — the workflow should never block on
          # missing release notes).
          version='${{ steps.tag.outputs.version }}'
          out="release-notes.md"
          if grep -q "^## \[$version\]" CHANGELOG.md; then
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { found=1; print; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$out"
          else
            printf "Release %s.\n" "$version" > "$out"
          fi
          {
            printf '\n### Verify this build\n\n'
            printf 'Signer certificate SHA-256: `%s`\n\n' '${{ steps.apk.outputs.cert }}'
            printf '```\nsha256sum -c qubee-%s.apk.sha256\napksigner verify --print-certs qubee-%s.apk\n```\n' "$version" "$version"
          } >> "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          # Only mark as prerelease when the tag has a `-` suffix
          # (semver pre-release), e.g. `v0.1.0-alpha`. Stable tags
          # (e.g. `v1.0.0`) ship as full releases.
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
            ${{ steps.shasum.outputs.mapping }}
          fail_on_unmatched_files: false
